syntax = "proto3";

package plutus;

option go_package = "github.com/bbmumford/plutus/proto/plutus";

import "proto/plutus/common.proto";

// ReputationType classifies the kind of reputation event.
enum ReputationType {
  REPUTATION_TYPE_UNSPECIFIED = 0;
  REPUTATION_TYPE_TRADE_COMPLETE = 1;  // completed trade
  REPUTATION_TYPE_DISPUTE = 2;          // dispute filed
  REPUTATION_TYPE_REVIEW = 3;           // post-trade review
}

// ReputationRecord represents a single reputation event. Records are signed
// by the recorder and gossiped via Whisper StatefulMerge topics.
message ReputationRecord {
  bytes subjectPubKey = 1;                // the party being reviewed
  bytes recorderPubKey = 2;              // the party recording the reputation
  ReputationType type = 3;
  int32 score = 4;                        // -1, 0, or +1
  string appId = 5;                       // application where the trade occurred
  string txHash = 6;                      // on-chain transaction hash for verification
  string comment = 7;                     // optional review text (max 2048 chars)
  Timestamp timestamp = 8;
  Signature signature = 9;               // recorder signs all fields except signature
}

// ReputationScore aggregates reputation metrics for a single identity.
message ReputationScore {
  int32 totalTrades = 1;
  double positiveRate = 2;                // 0.0 - 1.0
  double disputeRate = 3;                 // 0.0 - 1.0
  double avgRating = 4;                   // -1.0 to +1.0
  Timestamp firstTradeAt = 5;
  Timestamp lastTradeAt = 6;
  map<string, int32> appBreakdown = 7;   // appID -> trade count
}
