syntax = "proto3";

package plutus;

option go_package = "github.com/bbmumford/plutus/proto/plutus";

import "proto/plutus/common.proto";

// ChainWitnessAttestation is a signed statement by a witness node about
// on-chain state. Witnesses independently read blockchain state and
// produce attestations that are gossiped via Whisper for quorum verification.
message ChainWitnessAttestation {
  bytes attestationId = 1;          // unique attestation ID (random 16 bytes)
  ChainRef chain = 2;
  string subject = 3;               // what was attested (tx hash, address, contract)
  AttestationType type = 4;
  bytes witnessPubKey = 5;          // Ed25519 public key of the witness
  Timestamp attestedAt = 6;
  bytes payload = 7;                // attestation-specific data (balance, state snapshot, etc.)
  Signature witnessSignature = 8;   // witness signs all fields above
  uint64 blockNumber = 9;           // block number at time of attestation
  bytes blockHash = 10;             // block hash at time of attestation
}

enum AttestationType {
  ATTESTATION_TYPE_UNSPECIFIED = 0;
  ATTESTATION_TYPE_TX_CONFIRMED = 1;    // transaction confirmation
  ATTESTATION_TYPE_BALANCE = 2;          // address balance
  ATTESTATION_TYPE_ESCROW_STATE = 3;     // escrow contract state snapshot
  ATTESTATION_TYPE_CONTRACT_STATE = 4;   // generic contract state (e.g., PRC)
  ATTESTATION_TYPE_TX_BROADCAST = 5;     // confirmation that TX was broadcast
}

// EscrowSnapshot is the witness-attested state of an escrow contract.
// Multiple witnesses produce these independently; quorum agreement confirms state.
message EscrowSnapshot {
  string escrowAddress = 1;
  string buyer = 2;
  string seller = 3;
  Amount amount = 4;
  EscrowSnapshotStatus status = 5;
  string arbitrator = 6;
  uint64 createdAt = 7;
  uint64 timeoutAt = 8;
  uint64 blockNumber = 9;
  bytes blockHash = 10;
}

enum EscrowSnapshotStatus {
  ESCROW_SNAPSHOT_STATUS_UNSPECIFIED = 0;
  ESCROW_SNAPSHOT_STATUS_PENDING = 1;
  ESCROW_SNAPSHOT_STATUS_FUNDED = 2;
  ESCROW_SNAPSHOT_STATUS_RELEASED = 3;
  ESCROW_SNAPSHOT_STATUS_DISPUTED = 4;
  ESCROW_SNAPSHOT_STATUS_SETTLED = 5;
  ESCROW_SNAPSHOT_STATUS_REFUNDED = 6;
}

// WitnessRegistration is gossiped via Whisper StatefulMerge so all nodes
// know which peers can attest which chains.
//
// Drift reconciliation: the Go reference implementation at
// witness/registry.go treats reputation as a continuous [0.0, 1.0] float
// (see WitnessRegistration.Reputation and UpdateReputation). The earlier
// uint32 reputation_score encoding was never populated by Go callers and
// would silently truncate the float. Proto now matches Go (double).
//
// The last_seen field has been dropped: no Go caller reads it, and
// liveness is tracked out-of-band via gossip heartbeats rather than a
// field written into the registration record.
message WitnessRegistration {
  // Reserved field numbers / names from the pre-drift schema:
  //   5 last_seen         (Timestamp, removed — liveness tracked out-of-band)
  //   6 reputation_score  (uint32, replaced by `reputation` double at new tag)
  reserved 5, 6;
  reserved "lastSeen", "reputationScore";

  bytes witnessPubKey = 1;
  repeated string chainIds = 2;     // chains this witness can attest
  repeated string capabilities = 3; // e.g., "tx_confirm", "balance", "escrow_state"
  Timestamp registeredAt = 4;
  Signature witnessSignature = 7;   // witness signs registration
  // payoutAddresses maps chainID -> on-chain payout address. Address format
  // is chain-specific (0x... for EVM, bech32 for BTC, etc.). Required for
  // the witness fee distributor to route fee payouts to the correct on-chain
  // account per supported chain. A witness profile carries at least this field.
  map<string, string> payoutAddresses = 8;
  double reputation = 9;            // [0.0, 1.0] continuous reputation score
}

// VerificationPolicy configures quorum requirements for a verification request.
message VerificationPolicy {
  VerificationLevel level = 1;
  uint32 minWitnesses = 2;          // minimum witnesses that must respond
  uint32 minAgreement = 3;          // minimum witnesses that must agree
  uint32 timeoutSeconds = 4;        // max time to wait for quorum
}

enum VerificationLevel {
  VERIFICATION_LEVEL_UNSPECIFIED = 0;
  VERIFICATION_LEVEL_QUICK = 1;     // 1 witness, <2s
  VERIFICATION_LEVEL_STANDARD = 2;  // 3 witnesses, 2 agree, <5s
  VERIFICATION_LEVEL_HIGH = 3;      // 5 witnesses, 4 agree, <10s
  VERIFICATION_LEVEL_MAXIMUM = 4;   // 7 witnesses, 6 agree, <15s
}

// BalanceQuery is a client request to the witness mesh for a quorum-verified
// balance reading on a target chain. Published on plutus.<fp>.balance.request.
// Witnesses that can serve the chain respond with signed BalanceAttestations.
message BalanceQuery {
  string chainId             = 1;   // "polygon", "ethereum", "bitcoin", ...
  string address              = 2;  // chain-native address (hex EVM, bech32 BTC)
  string token                = 3;  // ERC20 contract addr; "" for native
  uint64 maxAgeSeconds      = 4;    // reject witnesses with stale snapshots
  bytes  requestNonce        = 5;   // random per-request; binds response to request
  string protocolFingerprint = 6;   // Layer 4 fork isolation
}

// BalanceAttestation is a signed statement from a witness reporting the balance
// it observed for (address, token) on chainId. Witnesses sign the canonical
// SHA-256 of fields 1-10 with their Ed25519 key.
message BalanceAttestation {
  string chainId             = 1;
  string address              = 2;
  string token                = 3;
  bytes  balance              = 4;  // big-endian uint256 for EVM, sat uint64 for BTC
  uint64 decimals             = 5;  // native unit decimals (18 EVM, 6 USDC, 8 BTC)
  string blockHash           = 6;
  uint64 blockNumber         = 7;
  int64  timestamp            = 8;  // witness's observation time (unix seconds)
  bytes  requestNonce        = 9;   // echoed from query
  bytes  witnessPubkey       = 10;  // Ed25519 public key
  bytes  signature            = 11; // Ed25519 over SHA-256 of fields 1-10
  string protocolFingerprint = 12;
}

// BalanceResult is the client-side outcome of a balance query: the quorum-agreed
// value (if any) plus all attestations collected for audit/debug.
message BalanceResult {
  string chainId        = 1;
  string address         = 2;
  string token           = 3;
  bytes  balance         = 4;  // quorum-agreed value
  uint64 decimals        = 5;
  uint64 blockNumber    = 6;   // latest block seen across attestations
  uint64 quorumCount    = 7;   // how many witnesses agreed
  uint64 quorumRequired = 8;   // K
  uint64 quorumTotal    = 9;   // N
  repeated BalanceAttestation attestations = 10; // for audit
}
