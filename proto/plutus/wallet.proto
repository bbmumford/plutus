syntax = "proto3";

package plutus;

option go_package = "github.com/bbmumford/plutus/proto/plutus";

import "proto/plutus/common.proto";

// AdapterDescriptor is the signed metadata blob distributed with each adapter.
// Wallets verify the signature against the PRC maintainer public key hash
// before loading an adapter.
message AdapterDescriptor {
  string chainId = 1;
  string currency = 2;
  string symbol = 3;
  string version = 4;
  string prcAddress = 5;
  bytes adapterHash = 6;            // SHA256 of the adapter binary
  bytes signerPubKey = 7;           // Ed25519 public key of the signer
  bytes signature = 8;              // Ed25519 signature over fields 1-6
}

// KeyRotationCert certifies that the maintainer has rotated their signing key.
// The old key signs the new key, creating a verifiable chain of authority.
message KeyRotationCert {
  bytes oldPubKey = 1;              // previous Ed25519 public key
  bytes newPubKey = 2;              // new Ed25519 public key
  Timestamp effectiveAt = 3;        // when the new key becomes active
  Timestamp graceUntil = 4;         // old key remains valid until this time
  bytes oldKeySignature = 5;      // old key signs (newPubKey || effectiveAt || graceUntil)
  bytes newKeySignature = 6;      // new key signs (oldPubKey || effectiveAt) for bidirectional proof
  string reason = 7;                // human-readable rotation reason
}

// PayoutDescriptor configures where maintainer fees are sent on each chain.
message PayoutDescriptor {
  string chainId = 1;
  string payoutAddress = 2;         // chain-specific address receiving fees
  uint32 maintainerFeeBps = 3;      // fee in basis points (max 500)
  uint32 witnessBps = 4;            // witness fee in basis points (max 100)
  bytes maintainerPubKeyHash = 5;    // SHA256(maintainer Ed25519 public key)
  string prcAddress = 6;            // deployed PRC contract address on this chain
}
