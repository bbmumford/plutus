syntax = "proto3";

package plutus;

option go_package = "github.com/bbmumford/plutus/proto/plutus";

import "proto/plutus/common.proto";

// ArbitratorProfile describes a registered arbitrator's identity, fees,
// expertise, and availability. Profiles are gossiped via the
// plutus.arbitrators StatefulMerge topic.
message ArbitratorProfile {
  bytes pub_key = 1;                      // Ed25519 public key
  map<string, string> chain_addrs = 2;    // chainID -> chain address
  uint32 fee_bps = 3;                     // fee in basis points (capped at 300)
  repeated string categories = 4;         // expertise areas: "digital-goods", "services", "physical"
  bool availability = 5;                  // whether the arbitrator is currently accepting cases
  string bio = 6;                         // arbitrator description (max 1024 chars)
  Signature signature = 7;               // Ed25519 signature over all fields except signature
  Timestamp registered_at = 8;
}

// ArbitratorSelection is a scored arbitrator returned by the selection algorithm.
message ArbitratorSelection {
  ArbitratorProfile profile = 1;
  double score = 2;                       // composite ranking score (0.0 - 1.0)
}

// SelectionCriteria configures arbitrator search and ranking.
message SelectionCriteria {
  string category = 1;                    // required expertise category
  string chain_id = 2;                    // required chain support
  uint32 max_fee_bps = 3;                // maximum acceptable fee (0 = no limit)
  uint32 limit = 4;                       // max results (0 = all)
}
