syntax = "proto3";

package plutus;

option go_package = "github.com/bbmumford/plutus/proto/plutus";

import "proto/plutus/common.proto";

// EscrowPolicy defines the terms of an escrow before it is created on-chain.
message EscrowPolicy {
  string buyerAddress = 1;
  string sellerAddress = 2;
  Amount amount = 3;
  uint64 timeoutSeconds = 4;        // escrow timeout duration
  string arbitratorAddress = 5;     // optional
  string prcAddress = 6;            // PRC contract address on this chain
  repeated bytes witnessHashes = 7;  // attestation hashes from witness quorum
  bytes receiptHash = 8;            // service receipt Merkle root (if applicable)
}

// EscrowState represents the on-chain state of an escrow at a point in time.
message EscrowState {
  string address = 1;               // escrow contract/UTXO address
  string buyer = 2;
  string seller = 3;
  Amount amount = 4;
  EscrowStatus status = 5;
  string arbitratorAddress = 6;
  uint64 createdAt = 7;             // block timestamp
  uint64 timeoutAt = 8;             // block timestamp
  string prcAddress = 9;
  ChainRef chain = 10;
}

enum EscrowStatus {
  ESCROW_STATUS_UNSPECIFIED = 0;
  ESCROW_STATUS_PENDING = 1;        // created, awaiting funding
  ESCROW_STATUS_FUNDED = 2;         // buyer has funded
  ESCROW_STATUS_RELEASED = 3;       // seller paid, escrow complete
  ESCROW_STATUS_DISPUTED = 4;       // dispute flag raised
  ESCROW_STATUS_SETTLED = 5;        // arbitrator ruled, funds distributed
  ESCROW_STATUS_REFUNDED = 6;       // timeout reached, buyer refunded
  ESCROW_STATUS_CANCELLED = 7;      // cancelled before funding
}

// SettlementRequest is sent by a party to initiate escrow settlement.
message SettlementRequest {
  string escrowAddress = 1;
  ChainRef chain = 2;
  FeeBreakdown fees = 3;
  Signature requesterSignature = 4;
  bytes receiptHash = 5;            // optional service receipt Merkle root
  repeated bytes witnessHashes = 6;  // witness attestation hashes
}

// FeeBreakdown contains the deterministic fee calculation result.
message FeeBreakdown {
  string maintainerFee = 1;         // big.Int as string
  string serviceProviderFee = 2;
  string arbitratorFee = 3;
  string witnessFee = 4;
  string sellerProceeds = 5;
  string total = 6;
}

// DisputeRequest flags an escrow for arbitration.
message DisputeRequest {
  string escrowAddress = 1;
  ChainRef chain = 2;
  string reason = 3;
  ContentAddress evidence = 4;      // hash of off-chain evidence bundle
  string disputerAddress = 5;
  Signature disputerSignature = 6;
}

// Ruling represents an arbitrator's ruling on a disputed escrow.
message Ruling {
  string escrowAddress = 1;
  uint32 buyerPercent = 2;          // 0-100
  uint32 sellerPercent = 3;         // 0-100
  string arbitratorAddress = 4;
  Signature arbitratorSignature = 5;
  ContentAddress reason = 6;        // hash of the reasoning document
}
