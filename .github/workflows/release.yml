# Plutus — Payment Engine Release
# Triggered on version tags (v*). Runs quality checks including BTC escrow tests,
# builds WASM binary, and creates a GitHub Release with artifacts.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  GO_VERSION: '1.25.0'

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.2

      - name: go vet
        run: go vet ./...

      - name: go test -race
        run: go test -race -count=1 -timeout=5m ./...

      - name: Test coverage
        run: |
          go test -coverprofile=coverage.out -timeout=5m ./...
          go tool cover -func=coverage.out | tail -1

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  wasm:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build WASM
        run: GOOS=js GOARCH=wasm go build -o plutus.wasm ./wasm/

      - name: Copy JS assets
        run: |
          cp wasm/plutus.js .
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" .

      - uses: actions/upload-artifact@v4
        with:
          name: wasm-artifacts
          path: |
            plutus.wasm
            plutus.js
            wasm_exec.js

  release:
    needs: [quality, wasm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/plutus.wasm
            artifacts/plutus.js
            artifacts/wasm_exec.js
